<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>STEP · концепт</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <style>
    :root { --bg:#0B0B0C; --card:#151517; --line:#2A2A2E; --paper:#F5F4F1; --red:#E2231A; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--paper); font-family: Onest, system-ui, sans-serif; min-height: 100dvh; display: grid; place-items: center; padding: 32px 16px; }
    main { width: 100%; max-width: 760px; }
    .logo { height: 40px; width: auto; display: block; }
    .k { margin-top: 40px; font-family: "JetBrains Mono", monospace; font-size: 13px; letter-spacing: .2em; color: #FF4A3D; }
    h1 { font-family: Unbounded, sans-serif; font-weight: 700; font-size: clamp(30px, 6vw, 52px); line-height: 1.05; margin-top: 12px; }
    .bar { width: 72px; height: 5px; background: var(--red); margin: 26px 0 30px; }
    a.card { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 24px 26px; margin-top: 14px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); color: var(--paper); text-decoration: none; transition: border-color .2s, transform .2s; }
    a.card:hover { border-color: #4A4A50; transform: translateY(-2px); }
    a.card b { display: block; font-family: Unbounded, sans-serif; font-weight: 600; font-size: 20px; }
    a.card span { display: block; color: #9A9A9F; font-size: 15px; margin-top: 6px; }
    a.card i { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--red); display: grid; place-items: center; font-style: normal; font-size: 22px; }
    footer { margin-top: 36px; font-size: 13px; color: #6E6E73; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/brand/step-logo-white.svg" alt="STEP Jiu-Jitsu Academy" />
    <div class="k">КОНЦЕПТ ДЛЯ STEP JIU-JITSU ACADEMY</div>
    <h1>Новый инстаграм и приложение STEP UP</h1>
    <div class="bar"></div>
    <a class="card" href="ig/"><div><b>Инстаграм после переоформления</b><span>Профиль, актуальные, новые обложки и рилсы</span></div><i>&rarr;</i></a>
    <a class="card" href="app/"><div><b>Приложение STEP UP</b><span>Экраны родителя, тренера и владельца, 3D-герой</span></div><i>&rarr;</i></a>
    <footer>Концепт подготовлен IP Marketing, 16 октября 2026</footer>
  </main>
</body>
</html>
