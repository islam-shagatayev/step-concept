<!doctype html>
<html lang="ru">
<head>
  <meta name="robots" content="noindex, nofollow" />
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<meta name="color-scheme" content="dark">
<title>STEP UP</title>
<meta name="description" content="Кликабельный прототип приложения STEP UP для детского клуба STEP Jiu-Jitsu: родитель, тренер, владелец.">
<link rel="icon" type="image/svg+xml" href="img/step-mark-white.svg">
<link rel="preload" href="fonts/Unbounded-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="stage-page">
  <header class="deck-bar" aria-label="Демо-панель">
    <div class="deck-top">
      <img class="deck-logo" src="img/step-up-white.svg" alt="STEP UP">
      <div class="roles" role="group" aria-label="Роль">
        <span class="roles-pill" aria-hidden="true"></span>
        <button type="button" data-role="parent">Родитель</button>
        <button type="button" data-role="coach">Тренер</button>
        <button type="button" data-role="owner">Владелец</button>
      </div>
      <p class="deck-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> экраны, <kbd>R</kbd> повтор анимации</p>
    </div>
    <nav class="screen-chips" aria-label="Экраны"></nav>
  </header>

  <div class="device-wrap">
    <div class="device">
      <div class="app" id="app">
        <div class="statusbar" aria-hidden="true">
          <span>9:41</span>
          <span class="sb-right">
            <span class="sb-signal"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M8 2.3c2.3 0 4.4.9 6 2.4l1.1-1.2A10.2 10.2 0 0 0 8 .6 10.2 10.2 0 0 0 .9 3.5L2 4.7a8.5 8.5 0 0 1 6-2.4Zm0 3.4c1.4 0 2.7.5 3.7 1.4l1.1-1.2A7 7 0 0 0 8 4a7 7 0 0 0-4.8 1.9l1.1 1.2c1-.9 2.3-1.4 3.7-1.4Zm0 3.4c.6 0 1.1.2 1.5.6L8 11.4 6.5 9.7c.4-.4.9-.6 1.5-.6Z"/></svg>
            <span class="sb-battery"></span>
          </span>
        </div>
        <div class="wipe" aria-hidden="true"></div>
        <main class="screens" id="screens"></main>
        <nav class="tabbar" id="tabbar" aria-label="Разделы"></nav>
        <div class="overlay" id="cardOverlay" role="dialog" aria-modal="true" aria-label="Карточка бойца"></div>
        <div class="story" id="story" role="dialog" aria-modal="true" aria-label="Сторис"></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="home-ind" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</div>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
</body>
</html>
